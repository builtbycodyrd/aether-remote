<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up Aether Remote</title>
<link rel="icon" href="/static/icon-32.png" sizes="32x32">
<link rel="icon" href="/static/icon-16.png" sizes="16x16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#01020a; --primary:#7c3aed; --secondary:#22d3ee;
    --accent2:color-mix(in srgb,var(--primary) 55%,#fff);
    --panel:color-mix(in srgb,var(--primary) 8%,rgba(8,7,20,.82));
    --line:color-mix(in srgb,var(--primary) 26%,transparent);
    --line2:color-mix(in srgb,var(--primary) 48%,transparent);
    --glow:color-mix(in srgb,var(--primary) 40%,transparent);
    --text:#f1f0f7; --muted:#7c8598; --good:#34d399; --bad:#fb7185;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
    font:15px/1.5 'Sora',system-ui,"Segoe UI",sans-serif}
  body{display:flex;align-items:center;justify-content:center;padding:34px 20px}
  body::before{content:"";position:fixed;inset:-25%;z-index:0;
    background:radial-gradient(45vmax 45vmax at 20% 5%,color-mix(in srgb,var(--primary) 22%,transparent),transparent 62%),
      radial-gradient(40vmax 40vmax at 85% 80%,color-mix(in srgb,var(--secondary) 10%,transparent),transparent 60%);
    filter:blur(42px)}

  .wrap{position:relative;z-index:1;width:100%;max-width:620px}
  .steps{display:flex;gap:6px;margin-bottom:22px}
  .steps i{flex:1;height:3px;border-radius:2px;
    background:color-mix(in srgb,var(--primary) 18%,transparent);display:block}
  .steps i.on{background:linear-gradient(90deg,var(--primary),var(--secondary))}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:30px 32px;backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .eyebrow{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;
    color:var(--accent2);margin-bottom:9px}
  h1{font-size:25px;margin:0 0 10px;font-weight:600;letter-spacing:.2px}
  p{color:#b9c2d0;margin:0 0 14px;font-size:14px}
  p.small{font-size:12.5px;color:var(--muted)}
  b{color:var(--text);font-weight:600}

  .opt{display:flex;gap:13px;align-items:flex-start;padding:14px 15px;
    border:1px solid var(--line);border-radius:12px;margin-bottom:10px;
    cursor:pointer;background:rgba(1,2,10,.35)}
  .opt:hover{border-color:var(--line2)}
  .opt.sel{border-color:var(--secondary);
    background:color-mix(in srgb,var(--secondary) 8%,transparent)}
  .opt .dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto;margin-top:2px;
    border:2px solid var(--line2)}
  .opt.sel .dot{border-color:var(--secondary);
    background:radial-gradient(circle,var(--secondary) 40%,transparent 45%)}
  .opt .t{font-size:14px}
  .opt .d{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}

  .btn{border:1px solid var(--line);background:color-mix(in srgb,var(--primary) 10%,transparent);
    color:var(--text);border-radius:10px;padding:11px 18px;font:inherit;font-size:14px;
    cursor:pointer}
  .btn:hover{background:color-mix(in srgb,var(--primary) 20%,transparent)}
  .btn.pri{background:linear-gradient(140deg,var(--primary),
      color-mix(in srgb,var(--secondary) 50%,var(--primary)));
    border-color:transparent;font-weight:600;box-shadow:0 6px 20px var(--glow)}
  .btn:disabled{opacity:.4;cursor:default;box-shadow:none}
  .nav{display:flex;gap:10px;align-items:center;margin-top:24px}
  .nav .sp{flex-grow:1}

  .qrbox{display:flex;gap:24px;align-items:center;
    background:rgba(1,2,10,.45);border:1px solid var(--line);
    border-radius:14px;padding:18px;margin:4px 0 16px}
  .qrbox img{width:184px;height:184px;border-radius:10px;background:#0b0a18;
    flex:0 0 auto}
  code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;
    background:rgba(1,2,10,.6);border:1px solid var(--line);border-radius:7px;
    padding:3px 7px;word-break:break-all;display:inline-block}

  input.code{width:100%;background:rgba(1,2,10,.6);border:1px solid var(--line);
    color:var(--text);border-radius:12px;padding:15px;font-size:27px;
    text-align:center;letter-spacing:.4em;text-indent:.4em;
    font-variant-numeric:tabular-nums;outline:none;font-family:inherit}
  input.code:focus{border-color:var(--primary)}
  .err{min-height:20px;font-size:13px;color:#fda4af;margin-top:10px}
  .ok{color:var(--good)}

  .check{display:flex;align-items:center;gap:11px;padding:13px 0;
    border-top:1px solid var(--line)}
  .check input{width:17px;height:17px;accent-color:var(--primary)}
  .done{text-align:center;padding:10px 0 4px}
  .done svg{margin-bottom:12px}
  ul{margin:0 0 14px;padding-left:18px;color:#b9c2d0;font-size:13.5px}
  li{margin-bottom:7px}
</style>
</head>
<body>
<div class="wrap">
  <div class="steps" id="steps"></div>
  <div class="card" id="card"></div>
</div>
<script src="/setup.js"></script>
</body>
</html>
