<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Aether Homelab</title>
<style>
  :root{
    --bg:#0a0a0c; --panel:#141419; --line:#26262f; --line2:#32323d;
    --text:#e8e8ef; --muted:#8b8b99; --primary:#5e9ad6; --secondary:#8ee3c8;
    --good:#34d399; --bad:#f26d6d; --warn:#f2b95e; --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding:calc(env(safe-area-inset-top) + 14px) 16px
        calc(env(safe-area-inset-bottom) + 28px)}
  header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  header h1{font-size:20px;margin:0;font-weight:650;letter-spacing:.2px}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--good);
    box-shadow:0 0 10px var(--good)}
  header .sub{color:var(--muted);font-size:12px;margin-left:auto}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;
    color:var(--muted);margin:22px 2px 10px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .tile{background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px;min-height:78px;
    display:flex;flex-direction:column;justify-content:space-between;
    -webkit-tap-highlight-color:transparent}
  .tile.tap{cursor:pointer;transition:transform .08s,border-color .15s}
  .tile.tap:active{transform:scale(.97)}
  .tile .t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px}
  .tile .big{font-size:26px;font-weight:680;line-height:1;margin-top:6px}
  .tile .u{font-size:11.5px;color:var(--muted);margin-top:3px}
  .bar{height:5px;border-radius:3px;background:var(--line2);overflow:hidden;
    margin-top:10px}
  .bar > i{display:block;height:100%;background:var(--primary);border-radius:3px}
  .sdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .on{background:var(--good);box-shadow:0 0 8px var(--good)}
  .off{background:var(--line2)}
  .busy{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .state{font-size:11.5px;color:var(--muted);text-transform:capitalize}
  .act{font-size:11px;color:var(--primary);align-self:flex-start;margin-top:8px}
  #mask{position:fixed;inset:0;background:rgba(6,6,10,.86);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
  #mask.show{display:flex}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;
    padding:26px 22px;width:100%;max-width:340px;text-align:center}
  .card h3{margin:0 0 4px;font-size:18px}
  .card p{color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.5}
  #code{width:100%;font-size:26px;text-align:center;letter-spacing:8px;
    padding:12px;border-radius:12px;border:1px solid var(--line2);
    background:#0c0c11;color:var(--text);font-variant-numeric:tabular-nums}
  .btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;
    background:var(--primary);color:#04121a;font-weight:680;font-size:15px;
    cursor:pointer}
  .enroll{margin-top:16px;font-size:12px;color:var(--muted);word-break:break-all}
  .enroll code{color:var(--secondary);font-size:13px}
  #err{color:var(--bad);font-size:12.5px;min-height:16px;margin-top:8px}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);
    transform:translateX(-50%) translateY(20px);background:var(--panel);
    border:1px solid var(--line2);color:var(--text);padding:10px 16px;
    border-radius:12px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;
    z-index:60}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{color:var(--muted);font-size:13px;padding:20px 2px}
  /* update banner - hidden via the attribute, with an id-level rule so no
     other display rule can ever out-rank it */
  #updbar{display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--primary);border-radius:14px;padding:11px 12px;
    margin:-4px 0 14px}
  #updbar[hidden]{display:none}
  #updbar .txt{flex:1;min-width:0}
  #updbar b{display:block;font-size:13.5px}
  #updbar span{font-size:11.5px;color:var(--muted)}
  .sbtn{border:1px solid var(--line2);background:transparent;color:var(--text);
    border-radius:10px;padding:7px 10px;font-size:12px;cursor:pointer;flex:0 0 auto}
  .sbtn.pri{background:var(--primary);border-color:var(--primary);color:#04121a;
    font-weight:650}
  #notes{position:fixed;inset:0;background:rgba(6,6,10,.86);z-index:55;
    display:flex;align-items:flex-end;justify-content:center}
  #notes[hidden]{display:none}
  #notes .sheet{background:var(--panel);border:1px solid var(--line);
    border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:80vh;
    overflow:auto;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px)}
  #notes h3{margin:0 0 10px;font-size:17px}
  #notes h4{margin:14px 0 6px;font-size:13px;color:var(--secondary)}
  #notes li,#notes p{font-size:13px;line-height:1.55;color:var(--text)}
  #notes .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
</style>
</head>
<body>
  <header>
    <div class="dot" id="live"></div>
    <h1>Homelab</h1>
    <div class="sub" id="meta">connecting…</div>
  </header>
  <div id="updbar" hidden>
    <div class="txt"><b id="ubTitle"></b><span id="ubSub"></span></div>
    <button class="sbtn" id="ubInfo">More info</button>
    <button class="sbtn pri" id="ubGo">Update</button>
    <button class="sbtn" id="ubSkip" aria-label="Hide this version">✕</button>
  </div>
  <div id="app"></div>
  <div id="notes" hidden>
    <div class="sheet">
      <h3 id="nTitle"></h3>
      <div id="nBody"></div>
      <div class="row">
        <button class="sbtn" id="nClose">Not now</button>
        <button class="sbtn pri" id="nGo">Update now</button>
      </div>
    </div>
  </div>

  <div id="mask">
    <div class="card">
      <h3>Aether Homelab</h3>
      <p>Enter the 6-digit code from your authenticator.</p>
      <input id="code" inputmode="numeric" autocomplete="one-time-code"
             maxlength="6" placeholder="000000">
      <button class="btn" id="go">Sign in</button>
      <div id="err"></div>
      <div class="enroll" id="enroll"></div>
    </div>
  </div>
  <div id="toast"></div>
  <script src="/home.js"></script>
</body>
</html>
